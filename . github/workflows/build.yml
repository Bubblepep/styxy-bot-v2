import android.widget.LinearLayout
import android.widget.TextView
import kotlinx.coroutines.*
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale
import java.util.concurrent.Executors
import kotlin.coroutines.resume
import kotlin.random.Random
​enum class BotState {
IDLE,
CALIBRATING,
CAPTURING_SCREEN,
MATCHING_CONTROL,
DISPATCHING_TAP,
VERIFYING_TRANSITION,
WORLD_MAP,
SEARCH_MENU,
TROOP_SELECTION,
VIGILANTE_WARNING,
PAUSED,
STOPPED,
ERROR
}
​class StyxyAccessibilityService : AccessibilityService() {
​companion object {
@Volatile
var instance: StyxyAccessibilityService? = null
private set
​const val PRIMARY_TARGET_KEY = "mafia_city_primary_control"
val logs = mutableListOf<String>()
​fun logEvent(
state: BotState,
confidence: Double,
action: String,
dispatched: Boolean,
verified: Boolean,
detail: String
) {
val ts = SimpleDateFormat("HH:mm:ss.SSS", Locale.US).format(Date())
val entry = "[$ts] STATE=state \vert{} CONF={"%.2f".format(confidence)} | " +
"ACT=$action \vert{} SENT=$dispatched | VERIFIED=$verified \vert{}$detail"
synchronized(logs) {
logs.add(0, entry)
if (logs.size > 200) logs.removeAt(logs.lastIndex)
}
}
}
​private lateinit var windowManager: WindowManager
private var controlPillView: View? = null
private var calibrationReticleView: View? = null
private var statusTextView: TextView? = null
​private val serviceScope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
private var activeJob: Job? = null
private val screenshotExecutor = Executors.newSingleThreadExecutor()
​@Volatile
var currentState: BotState = BotState.IDLE
private set
​@Volatile
var lastActionText: String = "None"
private set
​@Volatile
var lastErrorText: String = "None"
private set
​@Volatile
var verifiedTapCount: Int = 0
private set
​private var reticleNormX = 0.10f
private var reticleNormY = 0.88f
​override fun onServiceConnected() {
super.onServiceConnected()
instance = this
windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
createFloatingControlPill()
updateState(BotState.IDLE, "Service connected & overlay ready")
logEvent(BotState.IDLE, 1.0, "SERVICE_START", false, true, "Accessibility overlay attached")
}
​override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
​override fun onInterrupt() {
emergencyStop("Android system interrupted AccessibilityService")
}
​override fun onDestroy() {
emergencyStop("Service destroyed")
removeOverlays()
instance = null
super.onDestroy()
}
​fun emergencyStop(reason: String = "User pressed STOP") {
activeJob?.cancel()
activeJob = null
hideCalibrationReticle()
currentState = BotState.STOPPED
lastActionText = "HALTED"
lastErrorText = reason
updateOverlayStatus("STOPPED: $reason")
logEvent(BotState.STOPPED, 0.0, "EMERGENCY_STOP", false, true, reason)
}
​private fun updateState(newState: BotState, statusMsg: String) {
currentState = newState
lastActionText = statusMsg
updateOverlayStatus("${newState.name}:$statusMsg")
}
​private fun updateOverlayStatus(text: String) {
Handler(Looper.getMainLooper()).post {
statusTextView?.text = "STYXY [$verifiedTapCount] \vert{}$text"
}
}
​private fun createFloatingControlPill() {
if (controlPillView != null) return
​val container = LinearLayout(this).apply {
