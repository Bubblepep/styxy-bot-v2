package com.styxy.bot
​import android.content.Context
import android.graphics.Bitmap
import android.graphics.BitmapFactory
import android.graphics.Color
import org.json.JSONObject
import java.io.File
import java.io.FileOutputStream
import kotlin.math.abs
import kotlin.math.max
import kotlin.math.min
​data class MatchResult(
val found: Boolean,
val confidence: Double,
val centerNormX: Float,
val centerNormY: Float,
val matchPixelX: Int,
val matchPixelY: Int,
val reason: String
)
​data class SavedTemplate(
val name: String,
val bitmap: Bitmap,
val expectedNormX: Float,
val expectedNormY: Float,
val normWidth: Float,
val normHeight: Float,
val sourceScreenWidth: Int,
val sourceScreenHeight: Int
)
​object VisionEngine {
​private const val TEMPLATE_DIR = "templates"
private const val DIAG_DIR = "diagnostics"
​fun saveTemplate(
context: Context,
name: String,
fullScreen: Bitmap,
centerNormX: Float,
centerNormY: Float,
boxSizePx: Int = 110
): SavedTemplate {
val dir = File(context.filesDir, TEMPLATE_DIR).apply { mkdirs() }
val cx = (centerNormX * fullScreen.width).toInt().coerceIn(0, fullScreen.width - 1)
val cy = (centerNormY * fullScreen.height).toInt().coerceIn(0, fullScreen.height - 1)
val half = boxSizePx / 2
​val left = (cx - half).coerceAtLeast(0)
val top = (cy - half).coerceAtLeast(0)
val width = min(boxSizePx, fullScreen.width - left)
val height = min(boxSizePx, fullScreen.height - top)
​val cropped = Bitmap.createBitmap(fullScreen, left, top, width, height)
val imgFile = File(dir, "$name.png")
FileOutputStream(imgFile).use { out ->
cropped.compress(Bitmap.CompressFormat.PNG, 100, out)
}
​val meta = JSONObject().apply {
put("name", name)
put("expectedNormX", centerNormX.toDouble())
put("expectedNormY", centerNormY.toDouble())
put("normWidth", (width.toFloat() / fullScreen.width).toDouble())
put("normHeight", (height.toFloat() / fullScreen.height).toDouble())
put("sourceScreenWidth", fullScreen.width)
put("sourceScreenHeight", fullScreen.height)
}
File(dir, "$name.json").writeText(meta.toString(2))
​return SavedTemplate(
name = name,
bitmap = cropped,
expectedNormX = centerNormX,
expectedNormY = centerNormY,
normWidth = width.toFloat() / fullScreen.width,
normHeight = height.toFloat() / fullScreen.height,
sourceScreenWidth = fullScreen.width,
sourceScreenHeight = fullScreen.height
)
}
​fun loadTemplate(context: Context, name: String): SavedTemplate? {
val dir = File(context.filesDir, TEMPLATE_DIR)
val imgFile = File(dir, "$name.png")
val metaFile = File(dir, "$name.json")
if (!imgFile.exists() || !metaFile.exists()) return null
​val bmp = BitmapFactory.decodeFile(imgFile.absolutePath) ?: return null
val json = JSONObject(metaFile.readText())
return SavedTemplate(
name = name,
bitmap = bmp,
expectedNormX = json.getDouble("expectedNormX").toFloat(),
expectedNormY = json.getDouble("expectedNormY").toFloat(),
normWidth = json.getDouble("normWidth").toFloat(),
normHeight = json.getDouble("normHeight").toFloat(),
sourceScreenWidth = json.optInt("sourceScreenWidth", 1080),
sourceScreenHeight = json.optInt("sourceScreenHeight", 2340)
)
}
​fun findTemplateInROI(
screen: Bitmap,
template: SavedTemplate,
roiMarginNorm: Float = 0.08f,
minConfidence: Double = 0.82
): MatchResult {
val tplBmp = if (screen.width != template.sourceScreenWidth) {
val scaledW = max(16, (template.normWidth * screen.width).toInt())
val scaledH = max(16, (template.normHeight * screen.height).toInt())
Bitmap.createScaledBitmap(template.bitmap, scaledW, scaledH, true)
} else {
template.bitmap
}
​val tw = tplBmp.width
val th = tplBmp.height
​val expectedCx = (template.expectedNormX * screen.width).toInt()
val expectedCy = (template.expectedNormY * screen.height).toInt()
val marginX = (roiMarginNorm * screen.width).toInt()
val marginY = (roiMarginNorm * screen.height).toInt()
​val searchLeft = (expectedCx - marginX - tw / 2).coerceIn(0, max(0, screen.width - tw))
val searchRight = (expectedCx + marginX - tw / 2).coerceIn(searchLeft, max(0, screen.width - tw))
val searchTop = (expectedCy - marginY - th / 2).coerceIn(0, max(0, screen.height - th))
val searchBottom = (expectedCy + marginY - th / 2).coerceIn(searchTop, max(0, screen.height - th))
​var bestScore = -1.0
var bestX = expectedCx
var bestY = expectedCy
​val step = 3
for (y in searchTop..searchBottom step step) {
for (x in searchLeft..searchRight step step) {
val score = scorePatchCenterWeighted(screen, tplBmp, x, y, sampleStep = 2)
if (score > bestScore) {
bestScore = score
bestX = x
bestY = y
}
}
}
​val fineLeft = (bestX - step).coerceAtLeast(searchLeft)
val fineRight = (bestX + step).coerceAtMost(searchRight)
val fineTop = (bestY - step).coerceAtLeast(searchTop)
val fineBottom = (bestY + step).coerceAtMost(searchBottom)
​for (y in fineTop..fineBottom) {
for (x in fineLeft..fineRight) {
val score = scorePatchCenterWeighted(screen, tplBmp, x, y, sampleStep = 1)
if (score > bestScore) {
bestScore = score
bestX = x
bestY = y
}
}
}
​val centerPxX = bestX + tw / 2
val centerPxY = bestY + th / 2
val normX = centerPxX.toFloat() / screen.width
val normY = centerPxY.toFloat() / screen.height
val matched = bestScore >= minConfidence
​val reason = if (matched) {
"Matched '{template.name}' at ({centerPxX}, {centerPxY}) conf={"%.3f".format(bestScore)}"
} else {
"Confidence too low for '{template.name}': best={"%.3f".format(bestScore)} < required=${"%.2f".format(minConfidence)}"
}
​return MatchResult(
found = matched,
confidence = bestScore,
centerNormX = normX,
centerNormY = normY,
matchPixelX = centerPxX,
matchPixelY = centerPxY,
reason = reason
)
}
​private fun scorePatchCenterWeighted(
screen: Bitmap,
tpl: Bitmap,
startX: Int,
startY: Int,
sampleStep: Int
): Double {
val tw = tpl.width
val th = tpl.height
val innerXMin = tw / 4
val innerXMax = (tw * 3) / 4
val innerYMin = th / 4
val innerYMax = (th * 3) / 4
​var weightedDiffSum = 0.0
var totalWeight = 0.0
​for (ty in 0 until th step sampleStep) {
for (tx in 0 until tw step sampleStep) {
val sp = screen.getPixel(startX + tx, startY + ty)
val tp = tpl.getPixel(tx, ty)
​val dr = abs(Color.red(sp) - Color.red(tp))
val dg = abs(Color.green(sp) - Color.green(tp))
val db = abs(Color.blue(sp) - Color.blue(tp))
val pixelDiff = (dr + dg + db) / (255.0 * 3.0)
​val isInnerGlyph = tx in innerXMin..innerXMax && ty in innerYMin..innerYMax
val weight = if (isInnerGlyph) 3.0 else 1.0
​weightedDiffSum += pixelDiff * weight
totalWeight += weight
}
}
​if (totalWeight == 0.0) return 0.0
return (1.0 - (weightedDiffSum / totalWeight)).coerceIn(0.0, 1.0)
}
​fun computeScreenTransitionScore(before: Bitmap, after: Bitmap): Double {
if (before.width != after.width || before.height != after.height) return 1.0
val startY = (before.height * 0.10).toInt()
val endY = (before.height * 0.92).toInt()
val step = 8
​var changedPixels = 0
var totalSampled = 0
​for (y in startY until endY step step) {
for (x in 0 until before.width step step) {
val p1 = before.getPixel(x, y)
val p2 = after.getPixel(x, y)
val diff = abs(Color.red(p1) - Color.red(p2)) +
abs(Color.green(p1) - Color.green(p2)) +
abs(Color.blue(p1) - Color.blue(p2))
if (diff > 45) {
changedPixels++
}
totalSampled++
}
}
return if (totalSampled == 0) 0.0 else changedPixels.toDouble() / totalSampled
}
​fun saveDiagnosticScreenshot(context: Context, bmp: Bitmap, tag: String): String {
val dir = File(context.filesDir, DIAG_DIR).apply { mkdirs() }
val file = File(dir, "${System.currentTimeMillis()}_$tag.png")
FileOutputStream(file).use { out ->
bmp.compress(Bitmap.CompressFormat.PNG, 90, out)
}
return file.absolutePath
}
}
"""
