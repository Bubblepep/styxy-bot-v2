}
reticle.addView(label, FrameLayout.LayoutParams(boxSize, boxSize, Gravity.CENTER))
​val startX = (reticleNormX * metrics.widthPixels - boxSize / 2).toInt()
val startY = (reticleNormY * metrics.heightPixels - boxSize / 2).toInt()
​val params = WindowManager.LayoutParams(
boxSize,
boxSize,
WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
PixelFormat.TRANSLUCENT
).apply {
