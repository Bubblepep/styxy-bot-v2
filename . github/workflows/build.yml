BotState.DISPATCHING_TAP,
"Tapping (${tapX.toInt()}, {tapY.toInt()}) conf={"%.2f".format(match.confidence)}"
)
​showTapMarkerDot(tapX.toInt(), tapY.toInt())
val dispatched = dispatchReliableTap(tapX, tapY, durationMs = Random.nextLong(75L, 105L))
​if (!dispatched) {
lastErrorText = "OS rejected dispatchGesture()"
updateState(BotState.ERROR, lastErrorText)
logEvent(BotState.ERROR, match.confidence, "TAP_DISPATCH", false, false, lastErrorText)
return@launch
}
​updateState(BotState.VERIFYING_TRANSITION, "Waiting 950ms to verify screen transition...")
delay(950)
​controlPillView?.visibility = View.INVISIBLE
delay(160)
val afterBmp = captureHardwareScreen()
controlPillView?.visibility = View.VISIBLE
​if (afterBmp == null) {
lastErrorText = "Post-tap verification screenshot failed"
updateState(BotState.ERROR, lastErrorText)
return@launch
}
​val transitionScore = withContext(Dispatchers.Default) {
VisionEngine.computeScreenTransitionScore(beforeBmp, afterBmp)
}
​val postMatch = withContext(Dispatchers.Default) {
VisionEngine.findTemplateInROI(afterBmp, template, roiMarginNorm = 0.04f, minConfidence = 0.85)
}
​val transitionVerified = (transitionScore >= 0.035) || !postMatch.found
​if (transitionVerified) {
verifiedTapCount++
lastErrorText = "None"
val msg = "VERIFIED! Screen delta={"%.1f".format(transitionScore * 100)}%"
updateState(BotState.IDLE, msg)
logEvent(BotState.IDLE, match.confidence, "TAP_SUCCESS", true, true, msg)
} else {
lastErrorText = "Tap sent, but screen did not change (delta={"%.1f".format(transitionScore * 100)}%)"
VisionEngine.saveDiagnosticScreenshot(this@StyxyAccessibilityService, afterBmp, "no_transition")
updateState(BotState.ERROR, lastErrorText)
logEvent(BotState.ERROR, match.confidence, "VERIFY_FAIL", true, false, lastErrorText)
}
​} catch (e: CancellationException) {
logEvent(BotState.STOPPED, 0.0, "CANCELLED", false, false, "Routine cancelled safely")
} catch (e: Exception) {
lastErrorText = "Exception: ${e.message}"
updateState(BotState.ERROR, lastErrorText)
logEvent(BotState.ERROR, 0.0, "EXCEPTION", false, false, e.stackTraceToString().take(250))
}
}
}
​private suspend fun captureHardwareScreen(): Bitmap? = suspendCancellableCoroutine { cont ->
if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {
cont.resume(null)
return@suspendCancellableCoroutine
}
takeScreenshot(
Display.DEFAULT_DISPLAY,
screenshotExecutor,
object : TakeScreenshotCallback {
override fun onSuccess(screenshot: ScreenshotResult) {
try {
val hwBuffer = screenshot.hardwareBuffer
val colorSpace = screenshot.colorSpace
val wrapped = Bitmap.wrapHardwareBuffer(hwBuffer, colorSpace)
val softBmp = wrapped?.copy(Bitmap.Config.ARGB_8888, false)
wrapped?.recycle()
hwBuffer.close()
if (cont.isActive) cont.resume(softBmp)
} catch (e: Exception) {
if (cont.isActive) cont.resume(null)
}
}
​override fun onFailure(errorCode: Int) {
lastErrorText = "takeScreenshot failed with code=$errorCode"
if (cont.isActive) cont.resume(null)
}
}
)
}
​private suspend fun dispatchReliableTap(x: Float, y: Float, durationMs: Long): Boolean =
suspendCancellableCoroutine { cont ->
val path = Path().apply { moveTo(x, y) }
val stroke = GestureDescription.StrokeDescription(path, 0L, durationMs)
val gesture = GestureDescription.Builder().addStroke(stroke).build()
​val accepted = dispatchGesture(
gesture,
object : GestureResultCallback() {
override fun onCompleted(gestureDescription: GestureDescription?) {
if (cont.isActive) cont.resume(true)
}
​override fun onCancelled(gestureDescription: GestureDescription?) {
if (cont.isActive) cont.resume(false)
}
},
null
)
if (!accepted && cont.isActive) {
cont.resume(false)
}
}
​private fun showTapMarkerDot(pxX: Int, pxY: Int) {
Handler(Looper.getMainLooper()).post {
val size = 36
val dot = View(this).apply {
background = GradientDrawable().apply {
shape = GradientDrawable.OVAL
setColor(Color.parseColor("#8800E676"))
setStroke(4, Color.WHITE)
}
}
val params = WindowManager.LayoutParams(
size,
size,
WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
PixelFormat.TRANSLUCENT
).apply {
gravity = Gravity.TOP or Gravity.START
x = pxX - size / 2
y = pxY - size / 2
}
try {
windowManager.addView(dot, params)
Handler(Looper.getMainLooper()).postDelayed({
try {
windowManager.removeView(dot)
} catch (: Exception) {}
}, 650)
} catch (: Exception) {}
}
}
​private fun getPhysicalDisplayMetrics(): DisplayMetrics {
val dm = DisplayMetrics()
@Suppress("DEPRECATION")
windowManager.defaultDisplay.getRealMetrics(dm)
return dm
}
​private fun removeOverlays() {
hideCalibrationReticle()
controlPillView?.let {
try {
windowManager.removeView(it)
} catch (_: Exception) {}
}
controlPillView = null
}
}
